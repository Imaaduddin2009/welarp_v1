contract_id: DC-COLL-001-golden-c360
owner: Collections Data Office
source_contract: data/files/docs/data_contracts/DC-COLL-001_v1.0_EN.md
refresh:
  cadence: daily
  source_snapshot_date: '2026-09-28'
retention: Apply source-system retention schedules; retain crosswalk decisions and
  audit evidence per policy.
allowed_uses:
- collections operations
- analytics
- model training with approved feature controls
prohibited_uses:
- marketing
- protected-attribute or proxy-based decisions
- unmasked PII to an LLM
schema:
  customers:
  - golden_id
  - language
  - segment
  - hardship_flag
  - consent_sms
  - consent_email
  - consent_phone
  - bureau_score
  accounts:
  - account_id
  - golden_id
  - product_type
  - balance
  - overdue_amount
  - days_past_due
  - snapshot_date
  cases:
  - case_id
  - golden_id
  - status
  - stage
  - opened_date
  - product_type
  promises:
  - ptp_id
  - case_id
  - golden_id
  - promised_date
  - status
  contacts:
  - contact_id
  - case_id
  - golden_id
  - channel
  - contact_date
  - outcome
  - note_id
  notes:
  - note_id
  - golden_id
  - note_text_masked
  transcripts:
  - transcript_id
  - contact_id
  - case_id
  - golden_id
  - agent_id
  - call_start_ts
  - transcript_text_masked
  bureau_scores:
  - golden_id
  - score_date
  - bureau_score
  policy_chunks:
  - chunk_id
  - doc_id
  - title
  - version
  - effective_date
  - section
  - source_path
  - content
  crosswalk:
  - source_system
  - source_id
  - golden_id
  - match_confidence
  - rule_used
sensitivity_inventory: sensitivity_inventory.csv; all source columns are deny-by-default
data_semantics:
  overdue_amount: 'Estimate: max(minimum_due - payment_made, 0) for DPD > 0, capped
    at max(balance, 0); not a source field.'
  negative_balance: Retained as a valid net-credit balance; estimated overdue is zero.
  contact_exclusions: System events, invalid timestamps, and empty CRM references
    are excluded from curated agent contacts and counted in DQ exclusions.
known_limitations:
- Cross-system identity candidates use a custom DOB/name/phone/postal blocking and
  score; scores are not calibrated probabilities.
- Ambiguous cross-system candidates are isolated pending steward review; the observed
  review queue is large.
- The synthetic release has no labeled identity ground truth; match precision/recall
  cannot be measured.
- Text privacy masking is regex-based and should be reviewed before production use.
