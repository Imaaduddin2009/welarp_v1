# Business dictionary (semantic layer). The NL-to-SQL step may ONLY use what is listed here.
snapshot_date: "2026-09-28"     # "today" for every relative-date question (not the wall clock)
tables:
  customers:
    description: One row per real customer (golden record). No names, phones, emails, addresses, DOB. No protected attributes.
    columns:
      golden_id: Unique customer id (join key to every other table)
      language: Preferred language EN or FR
      segment: Customer segment (mass, affluent, student)
      hardship_flag: True if the customer is flagged as in financial hardship
      consent_sms: True if the customer consented to SMS contact
      consent_email: True if the customer consented to email contact
      consent_phone: True if the customer consented to phone calls
      bureau_score: Credit-bureau score 300-900 (NULL if unknown)
      n_product_systems: How many product systems (card, loan, deposit) the customer has
  accounts:
    description: One row per card / loan / deposit account at the snapshot date.
    columns:
      account_id: Account id
      golden_id: Customer
      product_type: card, loan or deposit
      balance: Current balance in dollars
      overdue_amount: Overdue dollars (0 if current)
      days_past_due: Days past due (0 = current)
      snapshot_date: Date of the balance snapshot
  cases:
    description: Collections cases. One customer can have several.
    columns:
      case_id: Case id
      golden_id: Customer
      status: open, on_hold, disputed or closed
      stage: early, mid or late delinquency stage
      agent_id: Collections agent who owns the case
      opened_date: Date opened
      product_type: Product the case is about
  promises:
    description: Promises to pay made on cases.
    columns:
      ptp_id: Promise id
      case_id: Case it belongs to (join to cases.case_id)
      golden_id: Customer
      promised_date: Date the customer promised to pay
      promised_amount: Promised dollars
      status: KEPT or BROKEN
  contacts:
    description: Contact attempts (calls, SMS, emails) made by agents.
    columns:
      contact_id: Contact id
      case_id: Case
      golden_id: Customer
      agent_id: Agent who made the contact
      channel: phone, sms or email
      direction: inbound or outbound
      contact_date: Date of contact
      outcome: answered, no_answer, promise_made, refused or voicemail
      note_id: Agent note written for this contact (join to notes.note_id)
  notes:
    description: Agent notes, personal data masked. Use the text search route for questions about what was said.
    columns:
      note_id: Note id
      golden_id: Customer
      note_text_masked: Masked free text
  transcripts:
    description: Call transcript turns aggregated by call; customer and contact identifiers are pseudonymous and text is masked.
    columns:
      transcript_id: Transcript id
      contact_id: Contact id
      case_id: Case id
      golden_id: Customer
      agent_id: Collections agent
      call_start_ts: Call start timestamp
      transcript_text_masked: Masked call transcript
  bureau_scores:
    description: Point-in-time credit bureau scores linked to a golden customer.
    columns:
      golden_id: Customer
      score_date: Bureau pull date
      bureau_score: Credit bureau risk score
  policy_chunks:
    description: Current policy, procedure, FAQ, and release documents chunked by section; superseded versions are excluded.
    columns:
      doc_id: Source document identifier
      title: Document title
      version: Current document version
      effective_date: Effective date
      section: Heading used as the chunk section
      source_path: Relative source document path
      content: Policy text
  benchmark_promises:
    description: Approved benchmark-ready promise facts. Status values include kept, partially_kept, and broken; only resolved outcomes belong in promise-rate denominators.
    columns:
      status: Normalized observed promise outcome
      due_date: Date the promise was due
      prior_broken_count: Previously broken promise count when the promise was made
      agent_site: Agent site or self_serve for promises without an agent site
      test_cell: Experimental strategy assignment cell
      assignment_method: Case assignment method; only random assignments support unbiased strategy comparisons
  benchmark_promise_channels:
    description: Minimal promise outcomes joined to the exact originating contact channel; generated as a read-only local projection for channel-grouped promise rates.
    columns:
      golden_id: Customer key used only for role scoping
      due_date: Date the promise was due
      status: Normalized observed promise outcome
      channel: Channel on the contact that created the promise
  benchmark_payment_links:
    description: Minimal payment-link send events from SMS/email contact history; generated as a read-only local projection for click-rate aggregates.
    columns:
      golden_id: Customer key used only for role scoping
      contact_date: Local date the message was sent
      channel: Normalized contact channel
      payment_link_id: Internal link key used only for distinct-link aggregation
      link_clicked: Whether the associated payment link was clicked
  benchmark_insolvency_cases:
    description: Minimal insolvency hold and overdue facts joined to masked cases; generated as a read-only local projection for aggregate reporting.
    columns:
      golden_id: Customer key used only for role scoping
      is_open: True when case outcome is not recorded
      insolvency_hold: Whether the case is on insolvency hold
      overdue_amount: Total overdue dollars on the case
  benchmark_cases:
    description: Minimized case facts for aggregate operations metrics; current_bucket is recomputed from current_dpd.
    columns:
      opened_date: Date case was opened
      current_dpd: Current days past due
      queue: Current operations queue
      is_open: True when case outcome is not recorded
      current_bucket: Delinquency bucket recomputed from current_dpd
      primary_product: Product attached to case
      hardship_flag: Agent-coded hardship flag
      cure_flag: Whether case cured
      days_to_cure: Days from case opening to cure when available
  benchmark_contacts:
    description: Minimized operational call/contact facts; excludes customer, phone, recording, and message identifiers.
    columns:
      channel: Current channel classification, preferring channel_v2 when populated
      direction: Inbound or outbound
      contact_ts: Customer-local contact timestamp
      contact_hour_local: Customer-local hour at contact
      rpc_flag: Whether the contact reached the right party
      dispute_raised_flag: Whether a dispute was raised on the contact
      within_permitted_hours: Whether the contact was within permitted local hours
      cease_request_flag: Whether the customer requested contact to cease
      system_event_type: Non-customer operational event marker; exclude system events from contact rates
  benchmark_out_of_hours_by_province:
    description: Pre-aggregated outbound-call permitted-hours compliance by month and province; contains no case or customer identifiers.
    columns:
      month: Calendar month for the outbound-call compliance aggregate
      province_code: Province code used only for aggregate contact-compliance reporting
      out_of_hours_pct: Share of outbound calls outside permitted hours
      calls: Number of eligible outbound calls
  benchmark_card_accounts:
    description: Minimized card account snapshot facts for delinquency-rate reporting; contains no customer or account identifiers.
    columns:
      snapshot_date: Account snapshot date
      account_status: Normalized account status
      product_code: Card product code
      dpd: Days past due; null values are excluded from delinquency denominators
  benchmark_account_history:
    description: Minimized monthly account delinquency history. account_key is an internal non-reversible join token and must not be returned or grouped.
    columns:
      account_key: One-way account join token for temporal self-joins
      product_type: Product type at snapshot
      snapshot_date: Parsed account snapshot date
      dpd: Days past due at snapshot
joins:
  - customers.golden_id = accounts.golden_id = cases.golden_id = promises.golden_id = contacts.golden_id = notes.golden_id
  - cases.case_id = promises.case_id = contacts.case_id
  - contacts.note_id = notes.note_id
  - customers.golden_id = transcripts.golden_id = bureau_scores.golden_id
  - benchmark_promises.test_cell and benchmark_promises.assignment_method are copied from the related case; benchmark_promises.agent_site is sourced from the assigned agent
  - benchmark_promise_channels joins promises_to_pay to contact_history by contact_id and to masked promises by ptp_id
  - benchmark_payment_links joins contact_history to masked contacts by contact_id for role scoping
  - benchmark_insolvency_cases joins collections_cases to masked cases by case_id for role scoping
  - benchmark_account_history.account_key joins snapshots of the same account only
terms:
  delinquent: days_past_due > 0 on any account
  overdue: overdue_amount > 0
  broken promise: promises.status = 'BROKEN'
  promise kept rate: KEPT / (KEPT + BROKEN)
  resolved promise outcomes: kept, partially_kept, or broken; exclude open, cancelled, and other unresolved statuses from outcome-rate denominators
  prior broken promise rate: group promises by min(prior_broken_count, 3), count partially_kept as resolved but not broken
  open case: benchmark_cases.is_open = true
  current delinquency bucket: benchmark_cases.current_bucket is recomputed from current_dpd rather than trusting the source bucket
  randomised strategy comparison: include only benchmark_cases.assignment_method = 'random' and compare rates by test_cell
  card delinquency rate: active or blocked card accounts with non-null dpd; delinquent when dpd >= 1
  point-in-time roll rate: join same account at the stated start and end dates; denominator is start-date dpd 1-30, rolled when end-date dpd > 30
  contact channel: coalesce(channel_v2, channel); use channel_v2 when present
  operational compliance geography: province_code is available only in pre-aggregated benchmark_out_of_hours_by_province
  policy precedence: current numbered bank policies override FAQ, script, incident, and synthetic summary text when sources conflict
  hardship programme duration: current POL-COLL-004 and HPT-2026 terms override older FAQ durations
  last N days: date >= snapshot_date - N days
  hardship customer: customers.hardship_flag = true
policy_precedence: [POL-COLL-004, HPT-2026, POL-COLL-001, PRC-COLL-012, PRC-COLL-010, FAQ-COLL-001]
retrieval_expansions:
  income evidence: POL-COLL-004 section 4.3 income evidence programme duration three months evidence income expenses
  hours may we: POL-COLL-001 section 5.1 permitted local contact hours Sunday time window
  sunday: POL-COLL-001 section 5.1 permitted local contact hours Sunday time window
  calling hours: POL-COLL-001 section 5.1 permitted local contact hours Sunday time window
  reduced hours: financial hardship reduced hours acknowledge record eligible hardship option before asking for payment
  hours were cut: financial hardship reduced hours acknowledge record eligible hardship option before asking for payment
  hours cut: financial hardship reduced hours acknowledge record eligible hardship option before asking for payment
  reduced payment: HP-LOAN-RED3 pay 50 percent of regular payment for 3 months interest accrues
  national do not call: telemarketing only collection calls do not block
  call attempts: outbound call attempt rolling 7 days per case
  rolling week: outbound call attempt rolling 7 days per case
  hardship procedure: POL-COLL-004 when a customer states hardship acknowledge hardship record hardship flag and reason offer at least one eligible hardship option before asking for payment do not request a payment the customer cannot afford
  lost work: financial hardship job loss acknowledge record hardship flag and reason offer eligible hardship option before asking for payment
  cannot afford: financial hardship cannot afford payment acknowledge record hardship flag offer eligible hardship option before asking for payment
  calls cease: written cease-communication request stops calls texts and emails required letters may continue
  legal representative: POL-COLL-001 representative authority verify authorised representative route all contact through lawyer Licensed Insolvency Trustee or non-profit credit counselling agency never disclose debt details to third parties
  representative: POL-COLL-001 representative authority verify authorised representative route all contact through lawyer Licensed Insolvency Trustee or non-profit credit counselling agency never disclose debt details to third parties
  adviser: POL-COLL-001 representative authority verify authorised representative route all contact through lawyer Licensed Insolvency Trustee or non-profit credit counselling agency never disclose debt details to third parties
  written no-contact request: written cease-communication request stops calls texts and emails; required letters and statements continue
  cease-communication request: written cease-communication request stops calls texts and emails; required letters and statements continue
  fee dispute: open a dispute and pause payment requests for the disputed amount until resolved; fraud claims go to the fraud team
  unfamiliar: customer disputes an unfamiliar transaction; open a dispute and pause payment requests for the disputed amount; transfer fraud claims to fraud team
  unfamiliar transaction: customer disputes a transaction; open a dispute and pause payment requests for the disputed amount; transfer fraud claims to fraud team
  lost overtime: financial hardship reduced hours or pay acknowledge record eligible hardship option before asking for payment
  reduced overtime: financial hardship reduced hours or pay acknowledge record eligible hardship option before asking for payment
  cannot manage instalment: financial hardship unable to meet payment acknowledge record hardship reason offer eligible option before asking for payment
  trustee: POL-COLL-001 Licensed Insolvency Trustee represents the customer all contact goes through representative; consumer proposal stay stops collection contact
  consumer proposal: stay of proceedings applies; all collection contact stops from filing date and case moves to insolvency hold
question_synonyms:
  rate: [percentage, percentages, percent, proportion, fraction, share, frequency, frequently, incidence, likelihood, likely, chance]
  compare: [contrast, versus, vs, compared with, compared to, relative to]
  product: [product family, product type, product category, primary product]
  queue: [work queue, collections team, team, unit]
  site: [agent site, branch, office]
  channel: [contact method, communication channel, communication method, medium]
  bucket: [dpd band, delinquency band, arrears band, delinquency bucket]
  cure: [cured, cured cases, recovery within, resolved within]
  promise: [repayment pledge, payment pledge, commitment, commitments]
  promise-kept: [honoured promise, honored promise, fulfilled promise, successful promise, kept promise, honoured, honored, fulfilled]
  broken-promise: [failed promise, missed promise, unkept promise, unsuccessful promise]
  random: [by chance, randomly assigned, assigned at random, assigned randomly]
  representative: [adviser, advisor, authorised person, authorized person, legal representative]
  cease: [stop contact, stop-contact, no-contact request, cease-communication request]
  rolling-window: [trailing period, rolling period, immediately preceding period, prior period]
forbidden_columns: [gender, gender_code, marital_status, citizenship, citizenship_status, household, dependants,
                    newcomer, newcomer_program_flag, accessibility, accessibility_needs_flag,
                    vulnerability, vulnerability_flag, accent, location, postal_code,
                    first_name, last_name, dob, date_of_birth, email, phone, national_id_hash, nid]
protected_proxy_terms: [religion, religious, faith, church, mosque, temple, synagogue, gurdwara,
                        worship, "place of worship", "religious belief", "religious affiliation",
                        "faith-based", congregation, spirituality, spiritual]
vocabulary: [customer, borrower, collector, installment, account, loan, card, deposit, promise, payment commitment, case, overdue, delinquen, balance, contact, call, attempt, note, hardship, affordability, agent,
             collection, payment, arrears, past due, dpd, cure, recovery, channel, contact method, consent, bureau, score, segment, queue, team, escalat, sms, email, transcript, recording, risk,
             dispute, complaint, fee, hour, hours, province, bucket, delinquency band, product, site, branch, rate, percentage, percent, proportion, fraction, share, programme, program, strategy, randomised, randomized,
             month, monthly, week, weekly, day, daily, year, period, snapshot, trend, compare, contrast, average, mean, count, number, total, volume, frequency]
